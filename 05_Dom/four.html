<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai and code</title>
</head>
<body style="background-color: blueviolet;color:blanchedalmond  ">
    <ul class = "language">
        <li>javascript</li>
   </ul>
    
</body>
<script>
    function addlangugae(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    
    }
    addlangugae("python");
    addlangugae("tyypescript");

    function addoptLanguage(langNAme){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langNAme))
        document.querySelector('.language').appendChild(li)
    }

   addoptLanguage("Java")
   addoptLanguage("python")

   //how to edit and remove value
    const secondlang =document.querySelector("li:nth-child(2)")
    console.log(secondlang);
    
    const newli=document.createElement('li')
    newli.textContent = " Mojo"
    secondlang.replaceWith(newli)
    //Edit

    const firstlang = document.querySelector('li:first-child')
    firstlang.outerHTML=' <li> TypeScript</li>'


    //REMOVE

    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()

</script>
</html>
